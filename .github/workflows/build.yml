name: Build CleanMac

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build CleanMac & Package DMG
      run: |
        swift --version
        chmod +x create_dmg.sh
        ./create_dmg.sh

    - name: Upload CleanMac DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CleanMac-Installer-macOS
        path: CleanMac-Installer.dmg
